name: Frontend Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'chatterbot-frontend/**'
      - '.github/workflows/frontend-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'chatterbot-frontend/**'
      - '.github/workflows/frontend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: chatterbot-frontend/package-lock.json

      - name: Install dependencies
        working-directory: chatterbot-frontend
        run: npm ci

      - name: Type-check frontend
        working-directory: chatterbot-frontend
        run: npm run typecheck

      - name: Lint frontend
        working-directory: chatterbot-frontend
        run: npm run lint

      - name: Run unit tests
        working-directory: chatterbot-frontend
        run: npm run test:run

      - name: Build application
        working-directory: chatterbot-frontend
        env:
          VITE_API_URL: http://localhost:5000
        run: npm run build

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: chatterbot-frontend/dist/

name: Backend and Security Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chatterbot-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: chatterbot-backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run backend and safety tests
        env:
          PYTHONPATH: .
          REDIS_URL: ''
        run: pytest -q
      - name: Validate migration chain
        env:
          PYTHONPATH: .
          REDIS_URL: ''
          FLASK_ENV: production
          SECRET_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          JWT_SECRET_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          ADMIN_API_KEY: cccccccccccccccccccccccccccccccc
          APP_URL: https://api.example.test
          FRONTEND_URL: https://app.example.test
          DATABASE_URL: sqlite:////tmp/chatterbot-migration-test.db
        run: |
          python -m scripts.prepare_database
          flask --app run.py db current | grep 20260908_add_pilot_launch_controls
      - name: Compile Python source
        run: python -m compileall -q app

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: chatterbot-frontend/package-lock.json
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r chatterbot-backend/requirements.txt
      - name: Audit production frontend dependencies
        working-directory: chatterbot-frontend
        run: npm audit --audit-level=high --omit=dev
      - name: Scan tracked source for secrets
        run: python chatterbot-backend/scripts/scan_secrets.py

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production container
        run: docker build chatterbot-backend
